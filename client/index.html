<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate your personalized exam schedule with our easy-to-use exam routine generator tool. Simply add courses, sections, and get your exam schedule in PDF or PNG format."
    />
    <meta
      name="keywords"
      content="exam routine, UIU exam routine, uiu exam routine , cse exam routine , exam schedule, personalized exam schedule, student exam generator, exam timetable, course schedule generator, student tools"
    />
    <meta name="author" content="Asadullah Imran" />
    <meta property="og:title" content="Exam Routine Generator" />
    <meta
      property="og:description"
      content="Generate your personalized exam schedule with ease."
    />
    <meta property="og:image" content="./assets/pic.png" />
    <meta property="og:url" content="https://examroutine.vercel.app/" />
    <meta name="twitter:card" content="./assets/pic.png" />
    <meta name="twitter:title" content="UIU Exam Routine Generator" />
    <meta
      name="twitter:description"
      content="Generate your personalized exam schedule with ease."
    />
    <meta name="twitter:image" content="./assets/pic.png" />
    <meta name="twitter:site" content="https://x.com/AsadullahImran6" />
    <meta name="twitter:creator" content="https://x.com/AsadullahImran6" />
    <title>Exam Routine Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <h2 class="welcome-text">Welcome to Exam Routine Generator</h2>
      <p class="loading-message">Loading your personalized experience...</p>
    </div>

    <div class="container">
      <h1>UIU Exam Routine Generator</h1>
      <p class="subtitle">Generate your personalized exam schedule</p>

      <!-- Form Inputs -->
      <div class="form-group">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="Enter your Student ID" />
      </div>
      <div class="form-group">
        <label for="program">Program</label>
        <select id="program">
          <option value="sose">School of Science and Engineering</option>
          <option value="sobe">School of Business and Economics</option>
        </select>
      </div>
      <div id="form-container"></div>

      <!-- Add Course and Generate Routine -->
      <div class="button-group">
        <button class="add-btn" onclick="addCourseSection()">
          <i class="fas fa-plus"></i> Add Course
        </button>
        <button class="generate-btn" onclick="generateRoutine()">
          <i class="fas fa-calendar-check"></i> Generate Routine
        </button>
      </div>

      <!-- Routine Display -->
      <div id="routine" class="routine-container" style="display: none"></div>
      <div id="error" class="error" style="display: none"></div>

      <!-- Download Buttons -->
      <div id="download-buttons" style="display: none">
        <button onclick="downloadRoutine('pdf')" class="download-btn-pdf">
          <i class="fas fa-file-pdf"></i> Download as PDF
        </button>

        <button onclick="downloadRoutine('png')" class="download-btn-png">
          <i class="fas fa-image"></i> Download as PNG
        </button>
      </div>
    </div>

    <script src="script.js"></script>

    <!-- Script for Loading Screen -->
    <script>
      window.addEventListener("load", () => {
        // Adding the class 'loaded' when the page is fully loaded
        setTimeout(() => {
          document.body.classList.add("loaded");
        }, 2200); // Delay to allow for the loading screen to be visible
      });
    </script>
  </body>
</html>
