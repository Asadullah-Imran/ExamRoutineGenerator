<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Routine Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Link to the compiled CSS file -->
  </head>
  <body class="bg-gray-100 flex justify-center items-center h-screen">
    <div
      class="container bg-white p-6 rounded-lg shadow-md w-full max-w-xl overflow-auto"
    >
      <h2 class="text-2xl font-bold text-center mb-4">
        Exam Routine Generator
      </h2>

      <!-- Shared Fields -->
      <div class="form-group mb-4">
        <label for="studentId" class="block font-semibold mb-2"
          >Student ID</label
        >
        <input
          type="text"
          id="studentId"
          placeholder="Enter your Student ID"
          class="w-full p-3 border border-gray-300 rounded-md"
        />
      </div>

      <div class="form-group mb-4">
        <label for="department" class="block font-semibold mb-2"
          >Department</label
        >
        <select
          id="department"
          class="w-full p-3 border border-gray-300 rounded-md"
        >
          <option value="BSCSE">BSCSE</option>
          <option value="BSEEE">BSEEE</option>
        </select>
      </div>

      <!-- Dynamic Course Fields -->
      <div id="form-container"></div>

      <button
        class="add-btn bg-green-500 text-white p-3 rounded-md w-full mb-4 hover:bg-green-400"
        onclick="addCourseSection()"
      >
        Add Course
      </button>
      <button
        class="bg-blue-500 text-white p-3 rounded-md w-full hover:bg-blue-400"
        onclick="generateRoutine()"
      >
        Generate Routine
      </button>

      <!-- Routine Container -->
      <div
        id="routine"
        class="routine-container mt-4 p-4 border border-gray-300 rounded-md bg-gray-50 hidden"
      ></div>

      <!-- Error Message -->
      <div
        id="error"
        class="error text-red-600 font-semibold mt-4 hidden"
      ></div>
    </div>

    <script src="../src/script.js"></script>
  </body>
</html>
